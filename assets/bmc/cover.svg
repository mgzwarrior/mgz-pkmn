<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="mgz-pkmn — Pokemon card-show prep">
  <title>mgz-pkmn — Buy Me a Coffee cover</title>
  <defs>
    <linearGradient id="card-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C94B"/>
      <stop offset="1" stop-color="#E8B028"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80623F"/>
      <stop offset="1" stop-color="#4D341F"/>
    </linearGradient>
  </defs>

  <!-- Sand background -->
  <rect width="1600" height="400" fill="#FBF6E8"/>

  <!-- Tagline ABOVE wordmark — pulled toward the top so the composition leaves a generous bottom safe zone for BMC's crop -->
  <text x="800" y="65" text-anchor="middle"
        font-family="'DM Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="500" letter-spacing="0.06em" fill="#6B4A2F">
    POKEMON CARD-SHOW PREP · FREE &amp; MIT-LICENSED
  </text>

  <!-- Logo + wordmark, scaled from native 285x88 by 2.2x = 627 x 194, centered horizontally. Card bottom sits at y≈310 — ~90px clear below for safe crop. -->
  <g transform="translate(487, 95) scale(2.2)">
    <g transform="translate(8, 8)">
      <rect x="0" y="0" width="56" height="72" rx="8" ry="8" fill="url(#card-front)" stroke="#6B4A2F" stroke-width="2"/>
      <rect x="5" y="5" width="46" height="9" rx="3" ry="3" fill="#2D5A28"/>
      <rect x="5" y="17" width="46" height="34" rx="4" ry="4" fill="#FBF6E8" stroke="#6B4A2F" stroke-width="1"/>
      <g transform="translate(28, 47)">
        <rect x="-1.5" y="-14" width="3" height="14" rx="1" fill="url(#trunk)"/>
        <g fill="#4A8B3B" stroke="#2D5A28" stroke-width="0.6" stroke-linejoin="round">
          <path d="M0,-14 C-8,-18 -12,-14 -13,-10 C-9,-12 -4,-13 0,-12 Z"/>
          <path d="M0,-14 C 8,-18 12,-14 13,-10 C 9,-12 4,-13 0,-12 Z"/>
          <path d="M0,-14 C-6,-22 -2,-26 0,-26 C 2,-26 6,-22 0,-14 Z"/>
          <path d="M0,-14 C-10,-15 -14,-12 -15,-9 C-13,-13 -8,-15 0,-15 Z" opacity="0.85"/>
          <path d="M0,-14 C 10,-15 14,-12 15,-9 C 13,-13 8,-15 0,-15 Z" opacity="0.85"/>
        </g>
        <circle cx="-3" cy="-13" r="1.6" fill="#4D341F"/>
        <circle cx="3" cy="-13" r="1.6" fill="#4D341F"/>
      </g>
      <rect x="7" y="56" width="32" height="3" rx="1" fill="#6B4A2F"/>
      <rect x="7" y="62" width="20" height="3" rx="1" fill="#80623F"/>
    </g>
    <text x="80" y="54"
          font-family="'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif"
          font-size="34" font-weight="700" letter-spacing="-0.02em" fill="#1F1B16">mgz-pkmn</text>
  </g>
</svg>
