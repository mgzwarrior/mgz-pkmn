repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: web-eslint
        name: web eslint
        language: system
        entry: bash -c 'cd web && npm run lint'
        files: ^web/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: web-typecheck
        name: web typecheck
        language: system
        entry: bash -c 'cd web && npx tsc -b'
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
      - id: dco-signoff
        name: DCO sign-off (auto-append if missing)
        language: system
        stages: [commit-msg]
        entry: .githooks/dco-signoff

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      # Conventional Commits check at commit-msg time. Configured in
      # `.gitlint` — same regex the `Conventional Commits` GitHub
      # Action enforces, so a green local commit is a green CI check.
      - id: gitlint
