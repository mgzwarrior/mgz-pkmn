<!doctype html><html><head>
<!-- @dsCard group="Colors" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .sw { display: flex; flex-direction: column; gap: 4px; }
  .sw .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border-1); padding: 6px 8px; align-items: flex-end; justify-content: flex-end; font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
  .sw .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head><body>
<div class="col">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div>
      <div class="ds-eyebrow">Neutral · Sand · Husk</div>
      <div style="font-family: var(--font-display); font-size: 22px; font-weight: 700;">Paper, parchment, coffee-husk</div>
    </div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">surfaces & ink</div>
  </div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:var(--sand-50);color:var(--husk-300)">50</div><div class="name">sand-50</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-100);color:var(--husk-300)">100</div><div class="name">sand-100</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-200);color:var(--husk-300)">200</div><div class="name">sand-200</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-400);color:#fff">400</div><div class="name">sand-400</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-600);color:#fff">600</div><div class="name">sand-600</div></div>
    <div class="sw"><div class="chip" style="background:var(--husk-200);color:#fff">husk-200</div><div class="name">husk-200</div></div>
    <div class="sw"><div class="chip" style="background:var(--husk-300);color:#fff">husk-300</div><div class="name">husk-300</div></div>
    <div class="sw"><div class="chip" style="background:var(--husk-500);color:#fff">husk-500</div><div class="name">husk-500</div></div>
  </div>
</div>
</body></html>
