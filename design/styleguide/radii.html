<!doctype html><html><head>
<!-- @dsCard group="Spacing" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .row-r { display: flex; align-items: flex-end; gap: 20px; }
  .r { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .r .box {
    width: 84px; height: 84px;
    background: var(--bg-surface);
    border: 1.5px solid var(--coconut-400);
    box-shadow: var(--shadow-sm);
  }
  .r .lab { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .r .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); font-weight: 600; }
</style>
</head><body>
<div class="col" style="gap:14px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Corner radii</div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">--radius-xs → --radius-2xl + pill</div>
  </div>
  <div class="row-r">
    <div class="r"><div class="box" style="border-radius:4px"></div><div class="val">4</div><div class="lab">xs · tags</div></div>
    <div class="r"><div class="box" style="border-radius:6px"></div><div class="val">6</div><div class="lab">sm · chips</div></div>
    <div class="r"><div class="box" style="border-radius:10px"></div><div class="val">10</div><div class="lab">md · btn/input</div></div>
    <div class="r"><div class="box" style="border-radius:14px"></div><div class="val">14</div><div class="lab">lg · cards</div></div>
    <div class="r"><div class="box" style="border-radius:20px"></div><div class="val">20</div><div class="lab">xl · panels</div></div>
    <div class="r"><div class="box" style="border-radius:28px"></div><div class="val">28</div><div class="lab">2xl · hero</div></div>
    <div class="r"><div class="box" style="border-radius:9999px;width:84px;height:36px"></div><div class="val">∞</div><div class="lab">pill</div></div>
  </div>
</div>
</body></html>
