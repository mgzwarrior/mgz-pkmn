<!doctype html><html><head>
<!-- @dsCard group="Components" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap:12px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Dropdown menu · export</div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">Radix-style · lg shadow · sand border</div>
  </div>
  <div class="row" style="gap:20px; align-items: flex-start">
    <button class="btn btn-ghost" style="background:var(--bg-surface)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div style="min-width:220px; background: var(--bg-surface); border: 1px solid var(--border-1); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 4px;">
      <div class="dd-item" style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; font-size:13px; color:var(--fg-1); background: var(--sand-100)">
        📊 Download .xlsx
      </div>
      <div class="dd-item" style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; font-size:13px; color:var(--fg-1)">
        📔 PDF binder
      </div>
      <div class="dd-item" style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; font-size:13px; color:var(--fg-1)">
        ☑ Checklist
      </div>
      <div style="height:1px; background:var(--border-1); margin: 4px 6px"></div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); padding: 6px 10px">5 rows</div>
    </div>
  </div>
</div>
</body></html>
