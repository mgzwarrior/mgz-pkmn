<!doctype html><html><head>
<!-- @dsCard group="Components" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap:12px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Empty state · results placeholder</div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">tells you what's next · plain</div>
  </div>
  <div style="border:1px dashed var(--border-2); background: var(--bg-surface); border-radius: var(--radius-lg); padding: 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px">
    <div style="width:48px; height:48px; border-radius:50%; background: var(--palm-50); display:grid; place-items:center; border: 1px solid var(--palm-200)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--palm-500)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.2"/><rect x="7" y="10" width="10" height="6" rx="1"/><rect x="7" y="5.5" width="10" height="2.4" rx="0.6"/></svg>
    </div>
    <div style="font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--fg-1)">No cards yet</div>
    <div style="font-size: 14px; color: var(--fg-2); max-width: 40ch;">Type a want-list above and hit <code>⌘↵</code> to run a lookup. Results stream in as they're priced.</div>
  </div>
</div>
</body></html>
