<!doctype html><html><head>
<!-- @dsCard group="Components" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap:14px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Buttons · variants + states</div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">primary · secondary · ghost · danger</div>
  </div>
  <div class="row" style="gap:10px; flex-wrap:wrap">
    <button class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>
      Look up
      <span style="font-family:var(--font-mono); font-size:11px; opacity:0.7; margin-left:2px">⌘↵</span>
    </button>
    <button class="btn btn-secondary">Open binder</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-danger">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      Stop
    </button>
    <button class="btn btn-primary btn-disabled" disabled>Disabled</button>
  </div>
  <div class="row" style="gap:10px; padding-top:4px">
    <button class="btn btn-primary" style="font-size:13px; padding:6px 12px">Small</button>
    <button class="btn btn-primary" style="font-size:14px; padding:8px 14px">Default</button>
    <button class="btn btn-primary" style="font-size:16px; padding:12px 20px">Large CTA</button>
  </div>
</div>
</body></html>
