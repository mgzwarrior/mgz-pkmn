<!doctype html><html><head>
<!-- @dsCard group="Brand" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .row-i { display:flex; gap: 18px; flex-wrap: wrap; }
  .iset { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; }
  .iset .ico { display:grid; place-items:center; width:48px; height:48px; border: 1px solid var(--border-1); border-radius: var(--radius-md); background: var(--bg-surface); color: var(--coconut-500); }
  .iset .lab { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .strip { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style>
</head><body>
<div class="col" style="gap:10px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Iconography · Lucide + brand SVGs</div>
    <div class="strip">1.75 stroke · 13–14px in buttons · 20px standalone</div>
  </div>
  <div class="row-i">
    <div class="iset"><div class="ico"><img src="../../assets/icon-palm.svg" width="22" height="22"/></div><div class="lab">palm</div></div>

    <div class="iset"><div class="ico"><img src="../../assets/icon-binder.svg" width="22" height="22"/></div><div class="lab">binder</div></div>
    <div class="iset"><div class="ico"><img src="../../assets/icon-coconut.svg" width="22" height="22"/></div><div class="lab">coconut</div></div>
    <div class="iset"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><div class="lab">Play</div></div>
    <div class="iset"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></div><div class="lab">Square</div></div>
    <div class="iset"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></div><div class="lab">Trash</div></div>

    <div class="iset"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div><div class="lab">Download</div></div>
    <div class="iset"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div class="lab">AlertCircle</div></div>
    <div class="iset"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div><div class="lab">RotateCcw</div></div>
  </div>
  <div class="strip" style="padding-top:4px;">+ Lucide via CDN: <code>https://unpkg.com/lucide@latest</code></div>
</div>
</body></html>
