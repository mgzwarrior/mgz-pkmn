<!doctype html><html><head>
<!-- @dsCard group="Brand" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .logo-cell { display:flex; flex-direction:column; gap:6px; align-items:center; padding: 14px; border: 1px solid var(--border-1); border-radius: var(--radius-md); background: var(--bg-surface); }
  .logo-cell .lab { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .logo-cell.dark { background: var(--husk-300); }
  .logo-cell.dark .lab { color: var(--sand-300); }
</style>
</head><body>
<div class="col" style="gap:12px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Logo · primary wordmark</div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">current wordmark · light + dark surface</div>
  </div>
  <div class="row" style="gap:14px; align-items:stretch">
    <div class="logo-cell" style="flex:1">
      <img src="../../assets/logo.svg" alt="mgz-pkmn" style="height:64px; width:auto; max-width:100%"/>
      <div class="lab">logo.svg · on cream</div>
    </div>
    <div class="logo-cell dark" style="flex:1">
      <img src="../../assets/logo-dark.svg" alt="mgz-pkmn (dark surface)" style="height:64px; width:auto; max-width:100%"/>
      <div class="lab">logo-dark.svg · on husk</div>
    </div>
  </div>
</div>
</body></html>
