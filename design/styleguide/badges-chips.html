<!doctype html><html><head>
<!-- @dsCard group="Components" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap:14px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Badges · chips · status pills</div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">.badge · .chip</div>
  </div>
  <div class="row" style="gap:8px; flex-wrap:wrap">
    <span class="badge badge-success">5 matched</span>
    <span class="badge badge-warning">over max</span>
    <span class="badge badge-danger">not found</span>
    <span class="badge badge-info">TCGdex</span>
    <span class="badge" style="background:var(--coconut-100);color:var(--coconut-600);border:1px solid var(--coconut-200)">v1.1.1</span>
    <span class="badge" style="background:var(--sun-100);color:var(--sun-600);border:1px solid var(--sun-200)">★ rare</span>
  </div>
  <div class="row" style="gap:8px; flex-wrap:wrap">
    <span class="chip">Charizard | Base Set | 4/102</span>
    <span class="chip">top:5 Charizard cards</span>
    <span class="chip">Pikachu | Jungle</span>
    <span class="chip">Mew ex</span>
    <span class="chip" style="border-color:var(--palm-400); color:var(--fg-1)">All Charizard | japanese</span>
  </div>
</div>
</body></html>
