<!doctype html><html><head>
<!-- @dsCard group="Components" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap:12px">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <div class="ds-eyebrow">Progress · streaming bulk lookup</div>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);">determinate · sun fill on coconut track</div>
  </div>
  <div class="col" style="gap:8px">
    <div class="row" style="gap:10px; align-items:center">
      <div style="flex:1; height:8px; background: var(--coconut-100); border-radius: var(--radius-pill); overflow:hidden; border: 1px solid var(--border-1)">
        <div style="width:34%; height:100%; background: linear-gradient(90deg, var(--sun-300), var(--sun-400)); box-shadow: inset 0 -1px 0 rgba(77,52,31,0.18)"></div>
      </div>
      <div style="font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); white-space:nowrap; font-weight:600">17 / 50</div>
    </div>
    <div class="row" style="gap:6px; flex-wrap:wrap; font-family: var(--font-mono); font-size: 12px;">
      <span class="chip" style="background:var(--palm-50); color:var(--palm-600); border-color:var(--palm-200)">✓ resolved 14</span>
      <span class="chip" style="background:var(--bg-surface); border-color:var(--border-1); color:var(--fg-2)">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun-300);animation: pulse 1s var(--ease-in-out) infinite;"></span>
        processing
      </span>
      <span class="chip" style="background:var(--bg-surface-2); color:var(--fg-3)">pending 34</span>
      <span class="chip" style="background:var(--warning-bg); color:var(--warning-fg); border-color:var(--warning-border)">⚠ 2 unmatched</span>
    </div>
  </div>
</div>
<style>@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1}}</style>
</body></html>
