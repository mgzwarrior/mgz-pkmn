[project]
name = "mgz-pkmn"
version = "0.1.0"
description = "CLI to look up Pokemon cards, fetch images and prices, and emit an .xlsx for card-show prep."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "reportlab>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Install with: `uv sync --extra api` (or `pip install mgz-pkmn[api]`).
# Pulls in the FastAPI server stack used by `api/`. CLI users don't need this.
api = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
pkmn = "mgz_pkmn.cli:cli"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgz_pkmn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
