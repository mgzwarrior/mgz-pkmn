[project]
name = "mgz-pkmn"
version = "0.1.0"
description = "CLI and web app to look up Pokemon cards across open data sources, fetch images and prices, and emit an .xlsx, PDF binder, set-completion checklist, and JSON report for card-show prep."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Grant", email = "mattgrant33@gmail.com" },
]
keywords = [
    "pokemon",
    "tcg",
    "trading-cards",
    "card-collection",
    "pricing",
    "spreadsheet",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "reportlab>=4.5.1",
    "requests>=2.34.1",
]

[project.optional-dependencies]
# Install with: `uv sync --extra api` (or `pip install mgz-pkmn[api]`).
# Pulls in the FastAPI server stack used by `api/`. CLI users don't need this.
api = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
pkmn = "mgz_pkmn.cli:cli"

[project.urls]
Homepage = "https://github.com/mgzwarrior/mgz-pkmn"
Repository = "https://github.com/mgzwarrior/mgz-pkmn"
Issues = "https://github.com/mgzwarrior/mgz-pkmn/issues"
Documentation = "https://github.com/mgzwarrior/mgz-pkmn/tree/main/docs"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgz_pkmn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
