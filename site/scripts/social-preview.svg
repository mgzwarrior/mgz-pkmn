<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="mgz-pkmn — the smart prep tool for Pokemon card shows">
  <title>mgz-pkmn — the smart prep tool for Pokemon card shows</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6E8"/>
      <stop offset="1" stop-color="#F4ECD3"/>
    </linearGradient>
    <linearGradient id="card-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C94B"/>
      <stop offset="1" stop-color="#E8B028"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80623F"/>
      <stop offset="1" stop-color="#4D341F"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4D341F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle horizon line -->
  <line x1="0" y1="540" x2="1280" y2="540" stroke="#D6C99F" stroke-width="1" opacity="0.6"/>

  <!-- Stacked card layers behind the hero card for depth -->
  <g transform="translate(110, 130)" filter="url(#card-shadow)">
    <rect x="32" y="40" width="320" height="412" rx="32" ry="32" fill="#E8DDBC" stroke="#80623F" stroke-width="3" opacity="0.55" transform="rotate(-7, 192, 246)"/>
    <rect x="16" y="20" width="320" height="412" rx="32" ry="32" fill="#F4ECD3" stroke="#80623F" stroke-width="3" opacity="0.8" transform="rotate(-3, 176, 226)"/>

    <!-- Hero card: sun-yellow front, palm header bar, cream art frame, palm tree -->
    <rect x="0" y="0" width="320" height="412" rx="32" ry="32" fill="url(#card-front)" stroke="#6B4A2F" stroke-width="4"/>
    <rect x="28" y="28" width="264" height="52" rx="16" ry="16" fill="#2D5A28"/>
    <rect x="28" y="96" width="264" height="196" rx="20" ry="20" fill="#FBF6E8" stroke="#6B4A2F" stroke-width="3"/>

    <!-- Palm tree centered in art frame -->
    <g transform="translate(160, 264)">
      <rect x="-6" y="-72" width="12" height="72" rx="3" fill="url(#trunk)"/>
      <g fill="#4A8B3B" stroke="#2D5A28" stroke-width="2" stroke-linejoin="round">
        <path d="M0,-72 C-44,-92 -66,-72 -72,-52 C-50,-62 -22,-68 0,-62 Z"/>
        <path d="M0,-72 C 44,-92 66,-72 72,-52 C 50,-62 22,-68 0,-62 Z"/>
        <path d="M0,-72 C-32,-118 -10,-138 0,-138 C 10,-138 32,-118 0,-72 Z"/>
        <path d="M0,-72 C-56,-78 -78,-62 -82,-46 C-72,-66 -44,-78 0,-78 Z" opacity="0.85"/>
        <path d="M0,-72 C 56,-78 78,-62 82,-46 C 72,-66 44,-78 0,-78 Z" opacity="0.85"/>
      </g>
      <!-- coconuts -->
      <circle cx="-14" cy="-66" r="7" fill="#4D341F"/>
      <circle cx="14" cy="-66" r="7" fill="#4D341F"/>
    </g>

    <!-- price-line marks below the art frame -->
    <rect x="40" y="320" width="178" height="14" rx="6" fill="#6B4A2F"/>
    <rect x="40" y="350" width="120" height="14" rx="6" fill="#80623F"/>
  </g>

  <!-- Right-hand content block -->
  <g transform="translate(520, 144)">
    <!-- "Now shipping" pill -->
    <g>
      <rect x="0" y="0" width="220" height="38" rx="19" fill="#FBF6E8" stroke="#D6C99F" stroke-width="1.5"/>
      <circle cx="22" cy="19" r="5" fill="#4A8B3B"/>
      <text x="38" y="25" font-family="'DM Sans', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#6B4A2F">Open-source · v1.2</text>
    </g>

    <!-- Wordmark -->
    <text x="0" y="118" font-family="'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif" font-size="84" font-weight="800" letter-spacing="-0.03em" fill="#2E1F11">mgz-pkmn</text>

    <!-- Headline -->
    <text x="0" y="184" font-family="'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.01em" fill="#2D5A28">Walk in with a plan,</text>
    <text x="0" y="226" font-family="'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.01em" fill="#2D5A28">not a hope.</text>

    <!-- Tagline -->
    <text x="0" y="278" font-family="'DM Sans', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#4D341F">Build want-lists, pull market prices across three</text>
    <text x="0" y="308" font-family="'DM Sans', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#4D341F">open data sources, and prep your next card show.</text>

    <!-- CTA chips -->
    <g transform="translate(0, 348)">
      <rect x="0" y="0" width="186" height="50" rx="12" fill="#F5C94B" stroke="#6B4A2F" stroke-width="2"/>
      <text x="93" y="33" text-anchor="middle" font-family="'DM Sans', ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2E1F11">Try the web app</text>

      <rect x="204" y="0" width="166" height="50" rx="12" fill="#FBF6E8" stroke="#4A8B3B" stroke-width="2"/>
      <text x="287" y="33" text-anchor="middle" font-family="'DM Sans', ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2D5A28">★ Star on GitHub</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="640" y="600" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#80623F">www.matt-grant.com / mgz-pkmn</text>
</svg>
