services:
  - type: web
    name: mgz-pkmn
    runtime: docker
    # Starter (not free) because the `disk:` block below requires a paid
    # plan — Render's blueprint validator rejects `disks are not supported
    # for free tier services` if the declared plan is free, even if the
    # actual service has been upgraded in the dashboard. The plan in this
    # file is the source of truth Render syncs against.
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # Opt this service into a PR preview deploy on every pull request against
    # main. Per-service `previews.generation` is what controls individual PR
    # previews; omitting it defaults to off and Render disables previews on
    # each blueprint sync (#389). Requires a paid workspace tier — Hobby
    # workspaces reject the field at sync time. See
    # https://render.com/docs/blueprint-spec#previews.
    previews:
      generation: automatic
    # Persistent disk so the cache survives redeploys (see #369). The mount
    # path matches the `XDG_CACHE_HOME` env var below; the cache module
    # (`src/mgz_pkmn/cache.py::_cache_root_path`) reads `XDG_CACHE_HOME` as
    # the *parent* directory and appends `mgz-pkmn`, so this resolves to
    # `/var/cache/mgz-pkmn`. Bumped to 50 GB after the per-card image warm
    # (#371) landed ~17 GB on top of the structural cache, leaving headroom
    # for the full English catalog plus future Scrydex-era additions.
    # Render disallows shrinking a disk in-place — only increases sync.
    disk:
      name: cache
      mountPath: /var/cache
      sizeGB: 50
    envVars:
      # Live API key for lookups against pokemontcg.io. Build-time use of
      # this var was retired in #369 along with the Dockerfile's
      # `warm-sets` bake; runtime warming on persistent disk took over.
      - key: POKEMONTCG_IO_API_KEY
        sync: false
      # Point the cache module at the persistent disk mount. Without this,
      # the cache root falls back to `~/.cache/mgz-pkmn` (the container's
      # ephemeral writable layer) and nothing survives a redeploy.
      - key: XDG_CACHE_HOME
        value: /var/cache
      # Warm the concept + set-cards + set-image caches on startup so the
      # first user after a deploy gets cache hits instead of paying the
      # full upstream round trip. The warmers run on
      # background daemon threads — startup and the /health check aren't
      # blocked — and their on-disk freshness manifests (24 h concepts /
      # 1 week set-cards / 1 week sets) keep restarts within the window
      # from re-walking. With the persistent disk above, a single warm
      # pass after the first deploy now serves every subsequent deploy
      # until the manifest TTL expires.
      - key: MGZ_PKMN_WARM_ON_STARTUP
        value: "1"
      # Phase 1 of the pre-Scrydex catalog-warm epic (#368, #370). The
      # per-card structural warm is heavier than the other three — a
      # fresh pass writes ~18,000 cache entries while walking ~170 sets
      # with a 500ms per-set throttle (so a no-API-key deploy can't burst
      # past pokemontcg.io's 30 rpm). First boot after this lands takes
      # ~30 min on a background daemon thread (service stays responsive
      # throughout); every boot after that hits the `card_warm.json`
      # freshness gate (1-week TTL) and skips the re-walk. With the
      # persistent disk in place this is exactly the bake-once,
      # serve-forever shape we want.
      - key: MGZ_PKMN_WARM_CARDS_ON_STARTUP
        value: "1"
      # Phase 2 of the pre-Scrydex catalog-warm epic (#368, #371). The
      # per-card *image* warm is the heaviest of all the warmers — a
      # fresh pass downloads ~36K image files (large + small for the
      # ~18K-card English catalog), totalling ~3-5 GB on the 10 GB
      # persistent disk above. First boot after this lands takes
      # *hours* on a background daemon thread (service stays responsive
      # throughout — /health doesn't gate on warm completion); every
      # boot after that hits the `card_images_warm.json` freshness gate
      # (1-week TTL) and skips. With the persistent disk in place this
      # delivers the SPA snappiness win the epic is built around —
      # every `<img>` tag in the results table, card detail modal, and
      # Browse grid now serves from /api/v1/cards/{id}/image/{size}
      # instead of round-tripping to pokemontcg.io's CDN.
      - key: MGZ_PKMN_WARM_CARD_IMAGES_ON_STARTUP
        value: "1"
      # Hosted-demo auth scaffold (#61 epic, foundation in #407, GitHub
      # provider in #408). Toggle is in-blueprint because it's a
      # reviewable deploy policy decision; the secrets below ride the
      # `sync: false` pattern so their values stay in the Render
      # dashboard. With auth on and the demo running in production,
      # `MGZ_PKMN_SESSION_SECRET` is required — the API refuses to boot
      # without it (api/auth/session.py:resolve_session_secret). Set the
      # three secrets in the Render dashboard *before* this block lands
      # so the post-merge redeploy boots clean instead of crash-looping.
      - key: MGZ_PKMN_AUTH_ENABLED
        value: "1"
      # Marks the deploy as production for the auth scaffold. This is
      # what `api/auth/session.py::_is_production` keys on to (a) require
      # `MGZ_PKMN_SESSION_SECRET` (refuses to boot if missing instead of
      # silently using the dev-only hard-coded fallback) and (b) flip
      # the session cookie to `Secure` so it only rides https. Without
      # this, the API would happily boot on a missing secret and issue
      # non-Secure cookies — the failure mode is silent and dangerous.
      - key: MGZ_PKMN_ENV
        value: production
      # itsdangerous signing key for the session cookie. Generate once
      # with `openssl rand -hex 32` and keep stable; rotating it
      # invalidates every active sign-in. Mark as secret in the
      # dashboard.
      - key: MGZ_PKMN_SESSION_SECRET
        sync: false
      # GitHub OAuth app credentials. Register the app at
      # https://github.com/settings/developers with callback URLs
      # `https://mgz-pkmn.onrender.com/api/v1/auth/github/callback`
      # and `https://mgz-pkmn.onrender.com/api/v1/auth/link/github/callback`.
      # Both vars must be set — missing either returns 503 from
      # `/auth/github/login` (api/auth/github.py:_oauth_client). Client
      # ID is borderline-public; keeping both as `sync: false` for
      # consistency.
      - key: MGZ_PKMN_GITHUB_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_GITHUB_CLIENT_SECRET
        sync: false
      # Google OAuth (OIDC) client credentials. Register the OAuth 2.0
      # client at https://console.cloud.google.com/apis/credentials with
      # callback URLs
      # `https://mgz-pkmn.onrender.com/api/v1/auth/google/callback`
      # and `https://mgz-pkmn.onrender.com/api/v1/auth/link/google/callback`.
      # Both vars must be set — missing either returns 503 from
      # `/auth/google/login` (api/auth/google.py:_oauth_client). Same
      # `sync: false` posture as the GitHub pair.
      - key: MGZ_PKMN_GOOGLE_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_GOOGLE_CLIENT_SECRET
        sync: false
      # Discord OAuth client credentials. Register the application at
      # https://discord.com/developers/applications with redirect URLs
      # `https://mgz-pkmn.onrender.com/api/v1/auth/discord/callback`
      # and `https://mgz-pkmn.onrender.com/api/v1/auth/link/discord/callback`.
      # Both vars must be set — missing either returns 503 from
      # `/auth/discord/login` (api/auth/discord.py:_oauth_client).
      - key: MGZ_PKMN_DISCORD_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_DISCORD_CLIENT_SECRET
        sync: false
      # Magic-link SMTP relay (#409 / #489). Buttondown's "SMTP endpoint"
      # is sender-side compose-by-email for newsletter drafts, not a
      # transactional relay we can authenticate to and send arbitrary
      # mail through, so the magic-link path uses Resend instead
      # (smtp.resend.com:587 STARTTLS — the existing SmtpMailer code in
      # api/auth/magic.py works against it unchanged). Free tier covers
      # 3,000 emails/month, well above magic-link login traffic. All
      # five vars must be set — `/auth/magic/request` returns 503 from
      # `_get_mailer` / `_get_sender` (api/auth/magic.py) when any is
      # missing. `sync: false` for the secrets; the From: address could
      # live in-blueprint but stays here for symmetry with the rest of
      # the auth-secret block.
      - key: MGZ_PKMN_SMTP_HOST
        sync: false
      - key: MGZ_PKMN_SMTP_PORT
        sync: false
      - key: MGZ_PKMN_SMTP_USERNAME
        sync: false
      - key: MGZ_PKMN_SMTP_PASSWORD
        sync: false
      - key: MGZ_PKMN_MAGIC_LINK_FROM
        sync: false
