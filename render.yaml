# Generate a Render Preview Environment for every PR against main. This
# block MUST live at the blueprint *root* (sibling to `services:`), not
# nested under the service: the root-level `previews` key is what enables
# Preview Environments, and Preview Environments are the only Render
# preview feature that honors the per-var `previewValue` overrides below
# (auth off, warmers skipped on previews). The service-level `previews:`
# block we used before (#389) still generated a preview but silently
# ignored every `previewValue`, so previews booted with the production
# values — auth on, full catalog warm against pokemontcg.io (#640).
# `previewValue` is applied at preview-environment *creation*, so an
# already-running preview won't pick up a newly-added override — it has to
# be regenerated (reopen the PR). Requires a paid workspace tier — Hobby
# workspaces reject the field at sync time. See
# https://render.com/docs/preview-environments and
# https://render.com/docs/blueprint-spec#previews.
previews:
  generation: automatic
services:
  - type: web
    name: mgz-pkmn
    runtime: docker
    # Starter (not free) because the `disk:` block below requires a paid
    # plan — Render's blueprint validator rejects `disks are not supported
    # for free tier services` if the declared plan is free, even if the
    # actual service has been upgraded in the dashboard. The plan in this
    # file is the source of truth Render syncs against.
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # Only rebuild + redeploy when a file that actually ships in the image
    # changes. The Dockerfile's build inputs are the SPA (`web/`, with shared
    # brand assets from `assets/`), the Python package (`src/`) and its deps
    # (`pyproject.toml`, `uv.lock`), the API (`api/`), the runtime-read
    # `CHANGELOG.md` (backs GET /api/v1/changelog) and `README.md` (hatchling
    # package readme), and the `Dockerfile` itself. Docs-, site-, and
    # design-only churn (`docs/`, `site/`, `design/`, `tests/`) no longer
    # spins up a production deploy or a PR preview. `paths` (rather
    # than the inverse `ignoredPaths`) is deliberate: an allowlist of the real
    # build inputs can't silently skip a deploy when a *new* top-level input
    # dir appears — it just won't match until added here, which is the safe
    # failure mode. Glob syntax, relative to the repo root. See
    # https://render.com/docs/blueprint-spec#buildfilter.
    buildFilter:
      paths:
        - "api/**"
        - "web/**"
        - "src/**"
        - "assets/**"
        - "pyproject.toml"
        - "uv.lock"
        - "Dockerfile"
        - "CHANGELOG.md"
        - "README.md"
    # Persistent disk so the cache survives redeploys (see #369). The mount
    # path matches the `XDG_CACHE_HOME` env var below; the cache module
    # (`src/mgz_pkmn/cache.py::_cache_root_path`) reads `XDG_CACHE_HOME` as
    # the *parent* directory and appends `mgz-pkmn`, so this resolves to
    # `/var/cache/mgz-pkmn`. Bumped to 50 GB after the per-card image warm
    # (#371) landed ~17 GB on top of the structural cache, leaving headroom
    # for the full English catalog plus future Scrydex-era additions.
    # Render disallows shrinking a disk in-place — only increases sync.
    disk:
      name: cache
      mountPath: /var/cache
      sizeGB: 50
    envVars:
      # Live API key for lookups against pokemontcg.io. Build-time use of
      # this var was retired in #369 along with the Dockerfile's
      # `warm-sets` bake; runtime warming on persistent disk took over.
      - key: POKEMONTCG_IO_API_KEY
        sync: false
      # Point the cache module at the persistent disk mount. Without this,
      # the cache root falls back to `~/.cache/mgz-pkmn` (the container's
      # ephemeral writable layer) and nothing survives a redeploy.
      - key: XDG_CACHE_HOME
        value: /var/cache
      # Auth/collections persistence. Left unset, `api/db/url.py` defaults to a
      # SQLite file at `<cache_root>/mgz-pkmn.db` — i.e. on the persistent disk
      # above, which is exactly what we want for the single-instance hosted
      # demo (survives redeploys, no external DB to run). This `sync: false`
      # entry documents the override knob: set a `postgresql://...` URL in the
      # dashboard to migrate onto a managed Postgres without a code change.
      - key: MGZ_PKMN_DATABASE_URL
        sync: false
      # Run Alembic migrations on startup so a deploy that ships a new
      # migration self-applies it (`api/main.py` startup hook). Default is on;
      # pinning `value: "1"` makes the production posture explicit and applies
      # to previews too, so a preview boots with an up-to-date schema.
      - key: MGZ_PKMN_AUTOMIGRATE
        value: "1"
      # Warm the concept + set-cards + set-image caches on startup so the
      # first user after a deploy gets cache hits instead of paying the
      # full upstream round trip. The warmers run on
      # background daemon threads — startup and the /health check aren't
      # blocked — and their on-disk freshness manifests (24 h concepts /
      # 1 week set-cards / 1 week sets) keep restarts within the window
      # from re-walking. With the persistent disk above, a single warm
      # pass after the first deploy now serves every subsequent deploy
      # until the manifest TTL expires.
      # `previewValue: "0"` short-circuits the warm pass on PR previews (#405):
      # Render injects this override only on preview environments, so a preview
      # deploy never walks the set/card/image catalog against pokemontcg.io —
      # the upstream-call volume and disk burn stay on production, where the
      # persistent disk actually amortizes them. Production keeps `value: "1"`.
      - key: MGZ_PKMN_WARM_ON_STARTUP
        value: "1"
        previewValue: "0"
      # Phase 1 of the pre-Scrydex catalog-warm epic (#368, #370). The
      # per-card structural warm is heavier than the other three — a
      # fresh pass writes ~18,000 cache entries while walking ~170 sets
      # with a 500ms per-set throttle (so a no-API-key deploy can't burst
      # past pokemontcg.io's 30 rpm). First boot after this lands takes
      # ~30 min on a background daemon thread (service stays responsive
      # throughout); every boot after that hits the `card_warm.json`
      # freshness gate (1-week TTL) and skips the re-walk. With the
      # persistent disk in place this is exactly the bake-once,
      # serve-forever shape we want.
      - key: MGZ_PKMN_WARM_CARDS_ON_STARTUP
        value: "1"
        previewValue: "0"
      # Phase 2 of the pre-Scrydex catalog-warm epic (#368, #371). The
      # per-card *image* warm is the heaviest of all the warmers — a
      # fresh pass downloads ~36K image files (large + small for the
      # ~18K-card English catalog), totalling ~3-5 GB on the 10 GB
      # persistent disk above. First boot after this lands takes
      # *hours* on a background daemon thread (service stays responsive
      # throughout — /health doesn't gate on warm completion); every
      # boot after that hits the `card_images_warm.json` freshness gate
      # (1-week TTL) and skips. With the persistent disk in place this
      # delivers the SPA snappiness win the epic is built around —
      # every `<img>` tag in the results table, card detail modal, and
      # Browse grid now serves from /api/v1/cards/{id}/image/{size}
      # instead of round-tripping to pokemontcg.io's CDN.
      - key: MGZ_PKMN_WARM_CARD_IMAGES_ON_STARTUP
        value: "1"
        previewValue: "0"
      # Bounded concurrency for /bulk SSE lookups (#303). The route fans each
      # line out as its own task gated by a semaphore of this size
      # (api/routes/lookup.py:_bulk_concurrency) instead of walking the list
      # serially. Pinned to the code default (8) to make the production
      # posture explicit: high enough to mask upstream latency on a ~200-line
      # Browse drop, low enough that a burst stays within pokemontcg.io's
      # 30 rpm free tier (the client's 429 backoff absorbs any overshoot).
      - key: MGZ_PKMN_BULK_CONCURRENCY
        value: "8"
      # Hosted-demo auth scaffold (#61 epic, foundation in #407, GitHub
      # provider in #408). Toggle is in-blueprint because it's a
      # reviewable deploy policy decision; the secrets below ride the
      # `sync: false` pattern so their values stay in the Render
      # dashboard. With auth on and the demo running in production,
      # `MGZ_PKMN_SESSION_SECRET` is required — the API refuses to boot
      # without it (api/auth/session.py:resolve_session_secret). Set the
      # three secrets in the Render dashboard *before* this block lands
      # so the post-merge redeploy boots clean instead of crash-looping.
      # `previewValue: "0"` turns the whole auth scaffold off on PR previews
      # (#405): reviewers hit the demo without a sign-in wall, which cuts the
      # per-PR verification loop, and a preview never needs the real OAuth /
      # SMTP / Apple secrets below to boot (with auth off, the providers are
      # never wired up). Production stays `value: "1"`.
      - key: MGZ_PKMN_AUTH_ENABLED
        value: "1"
        previewValue: "0"
      # Marks the deploy as production for the auth scaffold. This is
      # what `api/auth/session.py::_is_production` keys on to (a) require
      # `MGZ_PKMN_SESSION_SECRET` (refuses to boot if missing instead of
      # silently using the dev-only hard-coded fallback) and (b) flip
      # the session cookie to `Secure` so it only rides https. Without
      # this, the API would happily boot on a missing secret and issue
      # non-Secure cookies — the failure mode is silent and dangerous.
      # `previewValue: preview` keeps PR previews out of the production-only
      # branches `api/auth/session.py::_is_production` gates on — it stops
      # `resolve_session_secret` from *requiring* `MGZ_PKMN_SESSION_SECRET`
      # (unset on previews) and stops the session cookie from being forced
      # `Secure`. Moot while auth is off on previews via the override above,
      # but correct in its own right and a safety net if anything else ever
      # keys on the production flag.
      - key: MGZ_PKMN_ENV
        value: production
        previewValue: preview
      # itsdangerous signing key for the session cookie. Generate once
      # with `openssl rand -hex 32` and keep stable; rotating it
      # invalidates every active sign-in. Mark as secret in the
      # dashboard.
      - key: MGZ_PKMN_SESSION_SECRET
        sync: false
      # GitHub OAuth app credentials. Register the app at
      # https://github.com/settings/developers with callback URLs
      # `https://mgz-pkmn.onrender.com/api/v1/auth/github/callback`
      # and `https://mgz-pkmn.onrender.com/api/v1/auth/link/github/callback`.
      # Both vars must be set — missing either returns 503 from
      # `/auth/github/login` (api/auth/github.py:_oauth_client). Client
      # ID is borderline-public; keeping both as `sync: false` for
      # consistency.
      - key: MGZ_PKMN_GITHUB_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_GITHUB_CLIENT_SECRET
        sync: false
      # Google OAuth (OIDC) client credentials. Register the OAuth 2.0
      # client at https://console.cloud.google.com/apis/credentials with
      # callback URLs
      # `https://mgz-pkmn.onrender.com/api/v1/auth/google/callback`
      # and `https://mgz-pkmn.onrender.com/api/v1/auth/link/google/callback`.
      # Both vars must be set — missing either returns 503 from
      # `/auth/google/login` (api/auth/google.py:_oauth_client). Same
      # `sync: false` posture as the GitHub pair.
      - key: MGZ_PKMN_GOOGLE_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_GOOGLE_CLIENT_SECRET
        sync: false
      # Discord OAuth client credentials. Register the application at
      # https://discord.com/developers/applications with redirect URLs
      # `https://mgz-pkmn.onrender.com/api/v1/auth/discord/callback`
      # and `https://mgz-pkmn.onrender.com/api/v1/auth/link/discord/callback`.
      # Both vars must be set — missing either returns 503 from
      # `/auth/discord/login` (api/auth/discord.py:_oauth_client).
      - key: MGZ_PKMN_DISCORD_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_DISCORD_CLIENT_SECRET
        sync: false
      # Magic-link SMTP relay (#409 / #489). Buttondown's "SMTP endpoint"
      # is sender-side compose-by-email for newsletter drafts, not a
      # transactional relay we can authenticate to and send arbitrary
      # mail through, so the magic-link path uses Resend instead
      # (smtp.resend.com:587 STARTTLS — the existing SmtpMailer code in
      # api/auth/magic.py works against it unchanged). Free tier covers
      # 3,000 emails/month, well above magic-link login traffic. All
      # five vars must be set — `/auth/magic/request` returns 503 from
      # `_get_mailer` / `_get_sender` (api/auth/magic.py) when any is
      # missing. `sync: false` for the secrets; the From: address could
      # live in-blueprint but stays here for symmetry with the rest of
      # the auth-secret block.
      - key: MGZ_PKMN_SMTP_HOST
        sync: false
      - key: MGZ_PKMN_SMTP_PORT
        sync: false
      - key: MGZ_PKMN_SMTP_USERNAME
        sync: false
      - key: MGZ_PKMN_SMTP_PASSWORD
        sync: false
      - key: MGZ_PKMN_MAGIC_LINK_FROM
        sync: false
      # Newsletter subscriptions via Resend (#821, ADR-0028 — supersedes the
      # Buttondown embed in ADR-0014). `POST /api/v1/subscribe`
      # (api/routes/subscribe.py) creates a Resend contact in the audience and
      # stamps the chosen reason (collector / show / builder) onto its custom
      # `properties`; one Resend Automation branches on that reason to send the
      # matching 3-email welcome track. Both vars must be set — the route
      # returns 503 from `_resend_config` when either is missing. Operator
      # runbook (verify domain, create the audience, build the branched
      # Automation) lives in ADR-0028. Same Resend account + sending domain as
      # the magic-link SMTP block above — one vendor, one reputation.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      # Sign in with Apple credentials (#530). Configure in the Apple
      # Developer portal at https://developer.apple.com/account/resources:
      # (1) Services ID (e.g. `com.mgz-pkmn.web`) with **both** return
      # URLs registered exactly — Apple validates return URLs by exact
      # string match, so the account-linking flow's distinct URL must
      # be present too:
      #   - `https://mgz-pkmn.onrender.com/api/v1/auth/apple/callback`
      #     (sign-in)
      #   - `https://mgz-pkmn.onrender.com/api/v1/auth/link/apple/callback`
      #     (account linking, hit by `apple_link_start`)
      # The Services ID is `MGZ_PKMN_APPLE_CLIENT_ID`. (2) Apple
      # Developer Team ID from the portal header —
      # `MGZ_PKMN_APPLE_TEAM_ID`. (3) "Sign in with Apple" Key (download
      # the `.p8` once) — `MGZ_PKMN_APPLE_KEY_ID` is its 10-char ID,
      # `MGZ_PKMN_APPLE_PRIVATE_KEY` is the PEM contents (embedded
      # newlines load-bearing; paste the full
      # `-----BEGIN PRIVATE KEY-----` ... `-----END PRIVATE KEY-----`
      # block into the Render dashboard). All four must be set —
      # missing any returns 503 from `/auth/apple/login`
      # (api/auth/apple.py:_read_apple_env). Don't forget to also
      # register the project domain + `From:` source under "Sign in
      # with Apple for Email Communication" in the portal so outbound
      # mail to `@privaterelay.appleid.com` recipients isn't dropped
      # (see docs/deployment.md).
      - key: MGZ_PKMN_APPLE_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_APPLE_TEAM_ID
        sync: false
      - key: MGZ_PKMN_APPLE_KEY_ID
        sync: false
      - key: MGZ_PKMN_APPLE_PRIVATE_KEY
        sync: false
      # eBay integration (#421, epic #416). The application-level
      # OAuth client-credentials pair from the eBay Developer portal;
      # `EbayAuthClient` (src/mgz_pkmn/sources/ebay.py) mints + refreshes
      # the application access token used to read public listing comps.
      # `MGZ_PKMN_EBAY_TOKEN` is an optional pre-minted token that
      # short-circuits the client-credentials flow when set. The auth
      # client + deletion endpoint default to production eBay hosts;
      # `MGZ_PKMN_EBAY_ENV=sandbox` flips both to api.sandbox.ebay.com.
      - key: MGZ_PKMN_EBAY_CLIENT_ID
        sync: false
      - key: MGZ_PKMN_EBAY_CLIENT_SECRET
        sync: false
      - key: MGZ_PKMN_EBAY_TOKEN
        sync: false
      - key: MGZ_PKMN_EBAY_ENV
        value: production
      # Sold/completed-listing comps via eBay's Marketplace Insights API
      # (src/mgz_pkmn/sources/ebay_client.py). Default off and fails soft on a
      # 403 — the API grant is gated by eBay, so this stays `value: "0"` until
      # we're approved. Documented here so the eBay surface is fully declared.
      - key: MGZ_PKMN_EBAY_SOLD_ENABLED
        value: "0"
      # Marketplace account-deletion webhook (api/routes/ebay.py). eBay
      # requires this endpoint live + verified before granting production
      # keys. Register the endpoint URL and a matching 32–80 char
      # verification token in the eBay Developer **Alerts & Notifications**
      # portal (human runbook step — outside the blueprint). The hash uses
      # the byte-exact registered URL, so `MGZ_PKMN_EBAY_DELETION_ENDPOINT`
      # must equal what's entered in the portal. Missing either var returns
      # 503 from the challenge handler (api/routes/ebay.py:_read_config).
      - key: MGZ_PKMN_EBAY_VERIFICATION_TOKEN
        sync: false
      - key: MGZ_PKMN_EBAY_DELETION_ENDPOINT
        value: https://mgz-pkmn.onrender.com/api/v1/ebay/account-deletion
