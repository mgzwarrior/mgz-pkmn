[project]
name = "mgz-pkmn-api"
version = "1.3.1"
description = "FastAPI service for the mgz-pkmn card lookup tool."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "mgz-pkmn",
]

[tool.uv.sources]
mgz-pkmn = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
