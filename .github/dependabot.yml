# Dependabot keeps our pinned dependencies fresh. We cover:
#   - Python at the repo root (CLI + library, managed by uv/pyproject —
#     uses the "uv" ecosystem so uv.lock is regenerated alongside
#     pyproject.toml; Docker builds run `uv sync --frozen`, so an
#     out-of-sync lockfile would break the image)
#   - Python under api/ (FastAPI service, separate pyproject, no lockfile)
#   - npm under web/ (React SPA)
#   - npm under site/ (Astro marketing site)
#   - GitHub Actions used by our workflows
#
# Grouping minor + patch bumps into a single weekly PR cuts review churn;
# major bumps still come through individually so they get explicit attention.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "area:devops"
      - "type:chore"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "area:devops"
      - "area:web"
      - "type:chore"
    groups:
      api-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "area:devops"
      - "area:web"
      - "type:chore"
    groups:
      web-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "area:devops"
      - "area:site"
      - "type:chore"
    groups:
      site-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Astro 6 ships Vite 7 while @tailwindcss/vite@4.x bundles Vite 8.
      # The version mismatch breaks the build (see PR #148). Re-enable
      # by removing this ignore block once @tailwindcss/vite ships a
      # release compatible with Astro 6's bundled Vite, or once Astro 6
      # itself moves to Vite 8.
      - dependency-name: "astro"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "area:devops"
      - "type:chore"
