# Dependabot keeps our pinned dependencies fresh. We cover:
#   - Python at the repo root (CLI + library, managed by uv/pyproject)
#   - Python under api/ (FastAPI service, separate pyproject)
#   - npm under web/ (React SPA)
#   - GitHub Actions used by our workflows
#
# Grouping minor + patch bumps into a single weekly PR cuts review churn;
# major bumps still come through individually so they get explicit attention.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "area:devops"
      - "type:chore"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "area:devops"
      - "area:web"
      - "type:chore"
    groups:
      api-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "area:devops"
      - "area:web"
      - "type:chore"
    groups:
      web-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "area:devops"
      - "type:chore"
