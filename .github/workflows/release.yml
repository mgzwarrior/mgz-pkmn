name: Release

# release-please owns tagging + cutting the GitHub Release (it creates both with
# RELEASE_PAT, so the `release` event fires downstream workflows). This workflow
# runs on that event to build, publish to PyPI (trusted publishing + PEP 740
# attestation), close the milestone, and rebuild the marketing site. The
# Sigstore identity stays this workflow in the `pypi` environment, so the
# existing PyPI trusted publisher needs no change.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check src/

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mgz-pkmn
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  finalize:
    name: Finalize release
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      # The built sdist + wheel are deliberately not attached to the GitHub
      # Release: PyPI is the canonical channel and carries the PEP 740
      # attestation, GitHub already attaches the source archives, and immutable
      # releases reject post-hoc asset uploads (HTTP 422). See issue #651.
      - name: Close matching milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          number=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"${TAG}\") | .number")
          if [ -z "$number" ]; then
            echo "::notice::No open milestone named '${TAG}'; nothing to close."
            exit 0
          fi
          echo "Closing milestone '${TAG}' (#${number})…"
          gh api --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/milestones/${number}" \
            -f state=closed >/dev/null

  rebuild-site:
    name: Rebuild marketing site
    needs: finalize
    runs-on: ubuntu-latest
    # Don't fail the release if the hook is missing or the rebuild trigger
    # bounces — the GitHub Release is already cut and PyPI is published.
    continue-on-error: true
    steps:
      # The marketing site fetches GET /api/v1/changelog at build time
      # (see site/src/lib/changelog.ts), so kicking the Pages build the
      # instant the GitHub Release lands can race Render's redeploy and
      # bake the *previous* version into the static HTML. Poll the demo
      # API's /version endpoint until it reports the new tag before
      # firing the deploy hook. Falls through and fires anyway after a
      # 10-minute budget so the job never blocks indefinitely on a slow
      # or stuck Render rollout.
      - name: Wait for demo API to rotate
        env:
          EXPECTED: ${{ github.ref_name }}
          API_BASE: https://mgz-pkmn.onrender.com
        run: |
          expected="${EXPECTED#v}"
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl --fail-with-body -sS --max-time 10 "${API_BASE}/version" || true)
            actual=$(printf '%s' "$body" | python3 -c 'import json,sys; data=sys.stdin.read().strip(); print(json.loads(data).get("version", "") if data else "")' 2>/dev/null || true)
            if [ -z "$actual" ]; then
              echo "Demo API /version returned: ${body:-<empty>}"
            fi
            if [ "$actual" = "$expected" ]; then
              echo "Demo API rotated to ${actual}."
              exit 0
            fi
            echo "Demo API still on '${actual:-unknown}'; waiting…"
            sleep 15
          done
          echo "::warning::Demo API did not rotate to ${expected} within 10 min; firing the deploy hook anyway."

      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::CF_PAGES_DEPLOY_HOOK not set; skipping site rebuild."
            echo "Set the secret to: Cloudflare Pages → site → Settings → Build & deployments → Deploy hooks."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$HOOK"
          echo "Cloudflare Pages rebuild triggered."
