name: release-please

# Drafts the next version-bump PR from Conventional Commits on `main`,
# rotating `[Unreleased]` into a new versioned CHANGELOG section and bumping
# every version surface (`api/pyproject.toml`, `web/package.json`,
# `site/package.json`, `CITATION.cff`, `src/mgz_pkmn/__init__.py`) via the
# `extra-files` config. `release-please-lock.yml` re-syncs the lockfiles on the
# bot branch. The only manual step left is the CHANGELOG consolidation pass
# (#571) before merging.
#
# When the PR merges, release-please tags the commit and cuts the GitHub Release
# (which also flips the PR to `autorelease: tagged`, so it self-anchors next
# run). That `release` event triggers `release.yml`, which builds + publishes to
# PyPI. release-please creates the tag/Release with RELEASE_PAT so the downstream
# `release` event fires.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # release-please manages its own labels (`autorelease: pending`,
  # `autorelease: tagged`) through the Issues API — without this scope
  # the first push to `main` fails before the release PR is usable.
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
