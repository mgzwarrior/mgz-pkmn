name: Claude Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [assigned]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # Resolve whether this event refers to a same-repo PR (or no PR at all,
  # for `issues:assigned`). For `issue_comment` events, GitHub's payload
  # only carries `issue.pull_request` — the PR's head repo is NOT present
  # and must be fetched via the API. For the two `pull_request_review*`
  # events the payload already includes the PR, so we read directly.
  #
  # The downstream `claude` job runs only when `same_repo == 'true'`, so
  # fork PRs never invoke the action and never see `ANTHROPIC_API_KEY`.
  precheck:
    name: precheck (same-repo guard)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues')
    outputs:
      same_repo: ${{ steps.resolve.outputs.same_repo }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REVIEW_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            issue_comment)
              head_repo=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')
              ;;
            pull_request_review_comment|pull_request_review)
              head_repo="$REVIEW_HEAD_REPO"
              ;;
            *)
              # `issues:assigned` — no PR involved, no fork to gate.
              head_repo="$REPO"
              ;;
          esac
          if [[ "$head_repo" == "$REPO" ]]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: PR head repo '$head_repo' is not '$REPO' (fork PR)."
          fi

  claude:
    name: claude
    needs: precheck
    if: needs.precheck.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # `id-token: write` is required by anthropics/claude-code-action —
      # the action calls `OidcClient.getCall(id_token_url)` early in
      # `setupGitHubToken` to authenticate the GitHub App token mint,
      # and GitHub only populates `ACTIONS_ID_TOKEN_REQUEST_URL` when
      # the job carries this scope. Without it the action retries three
      # times then fails with "Could not fetch an OIDC token. Did you
      # remember to add `id-token: write` to your workflow permissions?"
      # The workflow-level `permissions:` block only narrows the
      # `GITHUB_TOKEN`; OIDC is a separate scope that must be granted
      # at the job level.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1.0.140
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 10
